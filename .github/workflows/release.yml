name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
        working-directory: apps/desktop
      - name: Build Tauri bundle (NSIS)
        working-directory: apps/desktop
        run: npm run tauri build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodedesk-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  github-release:
    name: Publish GitHub release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nodedesk-windows
          path: artifacts
      - name: Create prerelease with artifacts
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: artifacts/**/*.exe
          generate_release_notes: true

# Roadmap: Linux AppImage/deb and macOS dmg matrix jobs; signing (codesign /
# Developer ID / GPG) and reproducible-build verification before v1.0.
