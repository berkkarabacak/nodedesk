name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundles: nsis
            artifact_glob: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - platform: linux
            os: ubuntu-24.04
            bundles: appimage,deb
            artifact_glob: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          - platform: macos
            os: macos-latest
            bundles: dmg
            artifact_glob: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci
        working-directory: apps/desktop

      - name: Build Tauri bundles
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nodedesk-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}

  github-release:
    name: Publish GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nodedesk-*
          path: artifacts
          merge-multiple: true
      - name: Create release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

# Note: Windows/macOS binaries are unsigned in v1.x. Code signing and
# reproducible-build verification are required before marking releases
# stable for broad distribution (see docs/security.md).
