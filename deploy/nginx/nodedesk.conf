# Public TLS front for the NodeDesk directory.
# Install on 2.28.215.22. Certificates stay on the server; they are not in git.
#
# DNS (Squarespace, only if the record is still missing):
#   Type A, Host nodedesk, Data 2.28.215.22
# Leave the apex, www, and sync.berkkarabacak.com unchanged.
#
# Do not open Sunshine ports 47984, 47989, 47990, or 48010.
# Do not proxy to port 8080 (Notepad++ Sync).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nodedesk.berkkarabacak.com;

    # Point these at the certificate already issued for this hostname.
    # ssl_certificate     /etc/letsencrypt/live/nodedesk.berkkarabacak.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/nodedesk.berkkarabacak.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
