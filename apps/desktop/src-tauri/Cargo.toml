[package]
name = "nodedesk"
version = "0.1.0"
description = "NodeDesk — one-click remote computing built on Sunshine + Moonlight"
authors = ["NodeDesk contributors"]
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
