[package]
name = "nodedesk"
version = "1.2.0"
description = "NodeDesk — one-click remote computing built on Sunshine + Moonlight"
authors = ["NodeDesk contributors"]
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
axum = "0.7"
sysinfo = "0.32"
keyring = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
mac_address = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Secret Service (GNOME Keyring / KWallet) over libdbus. The sync backend is
# deliberate: the async one blocks on a runtime internally, which would panic
# when called from an async Tauri command.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
